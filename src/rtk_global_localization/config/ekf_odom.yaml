ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    debug: false
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: body
    base_link_frame_output: body
    world_frame: odom

    # Keep the optional odom-frame EKF on the raw FAST-LIO local odometry topic.
    # In bag playback we expose FAST-LIO itself on /odometry/local for RViz/debug,
    # and publish this secondary filter on /odometry/local_ekf only.
    odom0: /odometry/local
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 30
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0

    use_control: false

    process_noise_covariance: [0.05, 0.05, 1e-3,
                               1e-3, 1e-3, 0.03,
                               0.20, 0.20, 1e-3,
                               1e-3, 1e-3, 0.08,
                               1e-3, 1e-3, 1e-3]

    initial_estimate_covariance: [0.2, 0.2, 1e-9,
                                  1e-9, 1e-9, 0.1,
                                  1.0, 1.0, 1e-9,
                                  1e-9, 1e-9, 1.0,
                                  1e-9, 1e-9, 1e-9]
