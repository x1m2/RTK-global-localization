ekf_filter_node_map:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    predict_to_current_time: true
    transform_time_offset: 0.0
    transform_timeout: 0.2
    print_diagnostics: true
    debug: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: body
    base_link_frame_output: body
    world_frame: map

    odom0: /rtk/fastlio/odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 30
    odom0_nodelay: false
    odom0_differential: true
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0

    # Use this config only when /rtk/map_origin/odom contains live dual-antenna
    # yaw. It gives the global EKF absolute X/Y/yaw from the saved map origin.
    odom1: /rtk/map_origin/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 20
    odom1_nodelay: false
    odom1_differential: false
    odom1_relative: false
    # Use a generous threshold here as well; arbitrary-start playback can begin
    # far from the filter's zero initial state before the first absolute GPS fix
    # anchors map->odom.
    odom1_pose_rejection_threshold: 1000.0

    use_control: false

    process_noise_covariance: [0.30, 0.30, 1e-3,
                               1e-3, 1e-3, 0.08,
                               0.50, 0.50, 1e-3,
                               1e-3, 1e-3, 0.12,
                               1e-3, 1e-3, 1e-3]

    initial_estimate_covariance: [1000.0, 1000.0, 1e-9,
                                  1e-9, 1e-9, 10.0,
                                  10.0, 10.0, 1e-9,
                                  1e-9, 1e-9, 10.0,
                                  1e-9, 1e-9, 1e-9]
